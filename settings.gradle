// Load versions from gradle.properties before pluginManagement runs,
// because resolutionStrategy.eachPlugin fires before pluginManagement.plugins
// defaults are applied, so requested.version would be null otherwise.
def props = new java.util.Properties()
file("gradle.properties").withInputStream { props.load(it) }
def loomVersion    = props.getProperty("loom_version",       "1.16-SNAPSHOT")
def mdgVersion     = props.getProperty("moddevgradle_version", "2.0.140")

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }

    // Fabric Loom SNAPSHOTs don't publish Gradle plugin-marker artifacts,
    // so we map the plugin ID directly to the implementation JAR.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'dev.fabricmc.loom') {
                useModule("net.fabricmc:fabric-loom:${loomVersion}")
            }
        }
    }

    plugins {
        id 'dev.fabricmc.loom'    version "${loomVersion}" apply false
        id 'net.neoforged.moddev' version "${mdgVersion}"  apply false
    }
}

rootProject.name = 'Skinnable'
include('common', 'fabric', 'neoforge')
