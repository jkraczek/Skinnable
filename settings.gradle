pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }

    // Fabric Loom SNAPSHOTs don't publish a Gradle plugin-marker artifact,
    // so we map the plugin ID to the actual JAR here.
    // If you change loom_version in gradle.properties, update the version here too.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'dev.fabricmc.loom') {
                useModule("net.fabricmc:fabric-loom:1.16-SNAPSHOT")
            }
        }
    }

    plugins {
        id 'dev.fabricmc.loom'    version '1.16-SNAPSHOT' apply false
        id 'net.neoforged.moddev' version '2.0.140'       apply false
    }
}

rootProject.name = 'Skinnable'
include('common', 'fabric', 'neoforge')
