pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }

    // Map the new plugin ID to the implementation artifact in case the
    // plugin-marker artifact is not published for SNAPSHOT builds.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.fabricmc.fabric-loom') {
                useModule("net.fabricmc:fabric-loom:1.16-SNAPSHOT")
            }
        }
    }

    plugins {
        id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT' apply false
        id 'net.neoforged.moddev'     version '2.0.140'       apply false
    }
}

rootProject.name = 'Skinnable'
include('common', 'fabric', 'neoforge')
